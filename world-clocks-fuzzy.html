<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>World Clocks — Digital time zones</title>
<style>
  :root{
    --bg:#f6efe1;
    --card:#fff;
    --muted:#6b5d4c;
    --accent:#b8720a;
    --accent-2:#a85c1a;
    --line:#dccba0;
    --ink:#2b2118;
    --glass: rgba(255,255,255,0.6);
  }
  *{box-sizing:border-box}
  body{
    margin:0;
    font-family:Inter,system-ui,-apple-system,Segoe UI,Roboto,"Helvetica Neue",Arial;
    background:linear-gradient(180deg,var(--bg),#fff);
    color:var(--ink);
    padding:20px;
  }
  h1{font-family: "Zilla Slab", serif; margin:0 0 12px; font-size:20px;}
  .controls{
    display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:14px;
  }
  input[type="text"], select {
    padding:8px 10px;border-radius:8px;border:1px solid var(--line);background:var(--card);font-size:14px;color:var(--ink);
  }
  button{
    background:var(--accent);color:#fff;border:none;padding:8px 10px;border-radius:8px;font-weight:700;cursor:pointer;
  }
  button.ghost{background:transparent;color:var(--muted);border:1px solid var(--line);}
  button.icon{padding:8px;border-radius:10px;font-weight:600}
  .tog{
    display:inline-flex;align-items:center;gap:8px;background:var(--card);padding:6px;border-radius:999px;border:1px solid var(--line);
  }

  .grid{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
    gap:12px;
  }
  .clock{
    background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:8px;min-height:96px;
  }
  .tz-name{font-weight:700;display:flex;justify-content:space-between;align-items:center;gap:8px;}
  .tz-id{font-size:13px;color:var(--muted);word-break:break-all}
  .time{font-family:"IBM Plex Mono", monospace;font-size:20px;font-weight:700;}
  .secs{font-family:"IBM Plex Mono",monospace;color:var(--muted);font-size:13px}
  .date{font-size:13px;color:var(--muted)}
  .tz-short{font-size:13px;color:var(--accent-2);font-weight:700}
  .small-row{display:flex;justify-content:space-between;align-items:center}
  .empty{padding:24px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:12px}
  @media(max-width:480px){.controls{flex-direction:column;align-items:stretch}}
  .remove-btn{background:transparent;border:1px solid var(--line);color:var(--muted);padding:6px;border-radius:8px;cursor:pointer}
  .footer{margin-top:14px;color:var(--muted);font-size:13px;text-align:center}
</style>
</head>
<body>
  <h1>World clocks — Digital time zones</h1>

  <div class="controls" aria-label="Clock controls">
    <div style="display:flex;gap:8px;align-items:center">
      <input id="tzInput" list="tzList" placeholder="e.g. Asia/Kolkata or UTC" aria-label="Timezone name">
      <datalist id="tzList">
        <option>UTC</option>
        <option>Local</option>
        <option>Asia/Kolkata</option>
        <option>Europe/London</option>
        <option>America/New_York</option>
        <option>America/Los_Angeles</option>
        <option>Asia/Tokyo</option>
        <option>Australia/Sydney</option>
        <option>Asia/Dubai</option>
        <option>Africa/Johannesburg</option>
      </datalist>
      <button id="addBtn">Add</button>
      <button id="addLocal" class="ghost">+ Local</button>
    </div>

    <div style="margin-left:auto;display:flex;gap:8px;align-items:center">
      <label class="tog" title="Toggle 24-hour time">
        <input type="checkbox" id="hour24" style="display:none">
        <span id="hour24Label">24-hour</span>
      </label>
      <button id="clearAll" class="ghost">Clear all</button>
    </div>
  </div>

  <div id="clocks" class="grid" aria-live="polite"></div>

  <div class="footer">Tip: add any IANA timezone (e.g. "Asia/Kolkata", "America/Los_Angeles") or use "Local". Times update every second.</div>

<script>
(function(){
  const STORAGE_KEY = 'farmkhata_clocks';
  const SETTINGS_KEY = 'farmkhata_clocks_settings';

  const DEFAULT_ZONES = ['Local','UTC','Asia/Kolkata','Europe/London','America/New_York'];

  // UI refs
  const clocksEl = document.getElementById('clocks');
  const tzInput = document.getElementById('tzInput');
  const addBtn = document.getElementById('addBtn');
  const addLocalBtn = document.getElementById('addLocal');
  const clearAllBtn = document.getElementById('clearAll');
  const hour24Chk = document.getElementById('hour24');
  const hour24Label = document.getElementById('hour24Label');

  // state
  let zones = loadZones();
  let settings = loadSettings();
  
  // ensure at least defaults
  if(!zones || zones.length===0){
    zones = DEFAULT_ZONES.slice();
    saveZones();
  }
  if(settings.is24 === undefined) settings.is24 = true;

  // wire UI
  addBtn.addEventListener('click', ()=>addZoneFromInput());
  tzInput.addEventListener('keydown', (e)=>{ if(e.key==='Enter') addZoneFromInput(); });
  addLocalBtn.addEventListener('click', ()=>{ addZone('Local'); });
  clearAllBtn.addEventListener('click', ()=>{ if(confirm('Clear all clocks?')) { zones = []; saveZones(); render(); }});
  hour24Chk.checked = settings.is24;
  hour24Chk.addEventListener('change', ()=>{
    settings.is24 = hour24Chk.checked;
    saveSettings();
    renderTimes(); // update format
  });

  // initial render
  render();

  // update every second
  setInterval(renderTimes, 1000);

  // functions
  function addZoneFromInput(){
    const val = (tzInput.value || '').trim();
    if(!val) return;
    addZone(val);
    tzInput.value = '';
  }

  function addZone(id){
    const normalized = normalizeId(id);
    if(zones.includes(normalized)) {
      // bring to front
      zones = [normalized, ...zones.filter(z=>z!==normalized)];
    } else {
      zones = [normalized, ...zones];
    }
    saveZones();
    render();
  }

  function normalizeId(id){
    if(!id) return 'Local';
    const v = id.trim();
    if(/^local$/i.test(v)) return 'Local';
    return v;
  }

  function removeZone(id){
    zones = zones.filter(z=>z!==id);
    saveZones();
    render();
  }

  function saveZones(){ localStorage.setItem(STORAGE_KEY, JSON.stringify(zones)); }
  function loadZones(){
    try{
      const raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    }catch(e){ return []; }
  }
  function saveSettings(){ localStorage.setItem(SETTINGS_KEY, JSON.stringify(settings)); }
  function loadSettings(){
    try{
      const raw = localStorage.getItem(SETTINGS_KEY);
      return raw ? JSON.parse(raw) : {};
    }catch(e){ return {}; }
  }

  function render(){
    clocksEl.innerHTML = '';
    if(zones.length===0){
      clocksEl.innerHTML = '<div class="empty">No clocks — add a timezone to get started.</div>';
      return;
    }
    zones.forEach(tz=>{
      const card = document.createElement('div');
      card.className = 'clock';
      card.dataset.tz = tz;

      const header = document.createElement('div');
      header.className = 'tz-name';
      const title = document.createElement('div');
      title.innerHTML = `<div style="font-weight:800">${escapeHtml(displayLabel(tz))}</div>`;
      const remove = document.createElement('button');
      remove.className = 'remove-btn';
      remove.type = 'button';
      remove.setAttribute('aria-label','Remove timezone ' + tz);
      remove.textContent = 'Remove';
      remove.addEventListener('click', ()=>{ removeZone(tz); });

      header.appendChild(title);
      header.appendChild(remove);

      const timeRow = document.createElement('div');
      timeRow.className = 'time-row';
      const timeEl = document.createElement('div');
      timeEl.className = 'time';
      timeEl.id = 'time-' + encodeId(tz);
      const secs = document.createElement('div');
      secs.className = 'secs';
      secs.id = 'secs-' + encodeId(tz);

      timeRow.appendChild(timeEl);
      timeRow.appendChild(secs);

      const metaRow = document.createElement('div');
      metaRow.className = 'small-row';
      const dateEl = document.createElement('div');
      dateEl.className = 'date';
      dateEl.id = 'date-' + encodeId(tz);
      const tzshort = document.createElement('div');
      tzshort.className = 'tz-short';
      tzshort.id = 'tzshort-' + encodeId(tz);

      metaRow.appendChild(dateEl);
      metaRow.appendChild(tzshort);

      card.appendChild(header);
      card.appendChild(timeRow);
      card.appendChild(metaRow);

      clocksEl.appendChild(card);
    });
    renderTimes();
  }

  function renderTimes(){
    const now = new Date();
    zones.forEach(tz=>{
      const id = encodeId(tz);
      const timeEl = document.getElementById('time-' + id);
      const secsEl = document.getElementById('secs-' + id);
      const dateEl = document.getElementById('date-' + id);
      const tzshortEl = document.getElementById('tzshort-' + id);
      if(!timeEl) return;

      const timeZoneOption = tz==='Local' ? undefined : tz;
      // prepare options
      const options = {
        hour:'2-digit', minute:'2-digit', second:'2-digit',
        hour12: !settings.is24,
        timeZone: timeZoneOption,
      };

      // Format using formatToParts so we can separate seconds if desired
      try{
        const dtf = new Intl.DateTimeFormat(undefined, options);
        const parts = dtf.formatToParts(now);
        // build time without seconds for main display and seconds separately.
        const timeParts = [];
        let secondsPart = '';
        parts.forEach(p=>{
          if(p.type === 'second') secondsPart = p.value;
          else timeParts.push(p.value);
        });
        timeEl.textContent = timeParts.join('');
        secsEl.textContent = secondsPart ? ':' + secondsPart : '';

        // date
        const dateOptions = {weekday:'short', day:'2-digit', month:'short', year:'numeric', timeZone: timeZoneOption};
        dateEl.textContent = new Intl.DateTimeFormat(undefined, dateOptions).format(now);

        // timezone short name (e.g., GMT+5:30) — using timeZoneName:'short' where supported
        const tzNameOptions = {timeZone: timeZoneOption, timeZoneName:'short', hour:'2-digit'};
        const tn = new Intl.DateTimeFormat(undefined, tzNameOptions).formatToParts(now).find(p=>p.type==='timeZoneName');
        tzshortEl.textContent = tn ? tn.value : (timeZoneOption || Intl.DateTimeFormat().resolvedOptions().timeZone);

      }catch(e){
        // invalid timezone — show error
        timeEl.textContent = 'Invalid timezone';
        secsEl.textContent = '';
        dateEl.textContent = '';
        tzshortEl.textContent = '';
      }
    });
  }

  // helpers
  function displayLabel(tz){
    if(tz === 'Local'){
      const local = Intl.DateTimeFormat().resolvedOptions().timeZone || 'Local';
      return 'Local (' + local + ')';
    }
    return tz;
  }
  function encodeId(s){ return btoa(unescape(encodeURIComponent(s))).replace(/=+$/,''); }
  function escapeHtml(s){ return String(s||'').replace(/[&<>\"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

  // Validate timezone by trying to create a formatter — RangeError thrown for invalid tz
  function isValidTimeZone(tz){
    if(!tz) return false;
    if(/^local$/i.test(tz)) return true;
    try{
      new Intl.DateTimeFormat(undefined, {timeZone: tz});
      return true;
    }catch(e){
      return false;
    }
  }

  // Ensure timezone is valid when user adds it; if invalid prompt them
  function addZone(id){
    const normalized = normalizeId(id);
    if(/^local$/i.test(normalized)) {
      // local is always valid
      pushZone('Local');
      return;
    }
    if(!isValidTimeZone(normalized)){
      alert('Invalid timezone identifier. Use an IANA timezone like "Asia/Kolkata" or "America/New_York".');
      return;
    }
    pushZone(normalized);
  }

  function pushZone(normalized){
    if(zones.includes(normalized)){
      zones = [normalized, ...zones.filter(z=>z!==normalized)];
    } else {
      zones = [normalized, ...zones];
    }
    saveZones();
    render();
  }

  // Expose addZone for button handlers (we redefined above; make sure closures pick it)
  // (No-op because already defined above)
})();
</script>
</body>
</html>
